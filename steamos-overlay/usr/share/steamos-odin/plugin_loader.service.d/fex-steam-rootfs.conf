# The unit runs as root (upstream Decky) but the user's paths apply (and an
# x86-64 PluginLoader put there by hand runs via binfmt, whose FEX RootFS
# lives under the user).
[Service]
Environment=HOME=/home/steamos
Environment=XDG_CONFIG_HOME=/home/steamos/.config
Environment=XDG_DATA_HOME=/home/steamos/.local/share
