# Swap is zram (compressed RAM, zstd), not a disk: under memory pressure,
# compress idle anonymous memory before dropping file pages. A game's files
# often live on a microSD (~12 MB/s), so a dropped page costs far more to
# read back than a zram page costs to decompress. The kernel's docs suggest
# >100 for in-memory swap.
# Retroid Pocket Nova, Tomb Raider with 6.8 GB taken by a memory hog, 3 min
# each: swappiness 60 → 150 cut memory stalls 171 → 25 ms, major faults
# 63 → 7, lowest second 43.6 → 55.0 fps. page-cluster 0 and MGLRU
# min_ttl_ms 1000 on top made it worse (min_ttl: 229 major faults, 42.6 fps),
# so they stay at the defaults.
vm.swappiness = 150
