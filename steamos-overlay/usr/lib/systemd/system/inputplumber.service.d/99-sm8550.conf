[Unit]
Description=InputPlumber (SM8550 Steam Deck controller + OSK keyboard haptic)
After=sm8550-fixpad.service systemd-udevd.service
Wants=sm8550-fixpad.service

[Service]
# Older images' second copies of the device configs, before InputPlumber
# reads them.
ExecStartPre=-/usr/lib/steamos/sm8550-inputplumber-stale-configs
