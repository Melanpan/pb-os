# PluginLoader runs as root but must see the Steam user. binfmt (Box64) is
# only for an x86-64 PluginLoader put there by hand; the image's is arm64.
[Unit]
After=systemd-binfmt.service local-fs.target home.mount
Wants=systemd-binfmt.service

[Service]
Environment=USER=steamos
Environment=HOME=/home/steamos
Environment=XDG_CONFIG_HOME=/home/steamos/.config
Environment=XDG_DATA_HOME=/home/steamos/.local/share
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=BOX64_NOBANNER=1
Restart=always
RestartSec=5
KillMode=control-group
