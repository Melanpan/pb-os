# AYN Thor: "Top screen", the output Steam, games, Steam's volume bar and
# the volume keys use, a loopback into the real output (speakers, HDMI or
# Bluetooth). Its volume is the top screen's alone: barry_launcher_audio
# keeps it the default, holds the real output at 100 % and plays the
# bottom screen's apps straight on the real output at their own volume.
# Linked into /etc/pipewire/pipewire.conf.d by pbos-thor-audio.service,
# which runs on the Thor only.
context.modules = [
    {
        name = libpipewire-module-loopback
        flags = [ nofail ]
        args = {
            node.description = "Top screen"
            # PB-OS locks the graph to 1024 (99-konkr-quantum.conf); a
            # smaller loopback latency made the speakers stutter and resync.
            node.latency = 1024/48000
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "pbos_top_screen"
                media.class = "Audio/Sink"
                # The default over the real outputs when none is chosen.
                priority.session = 3000
            }
            playback.props = {
                node.name = "pbos_top_screen_out"
                node.description = "Top screen (to the real output)"
                # Lets the real output sleep while nothing plays.
                node.passive = true
                # barry_launcher_audio picks the real output.
                state.restore-target = false
            }
        }
    }
]
